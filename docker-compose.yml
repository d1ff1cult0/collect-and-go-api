services:
  prijsspoor:
    build: .
    image: prijsspoor:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Publieke URL van je installatie (gebruikt in API-links en documentatie).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SCRAPE_INTERVAL_HOURS: ${SCRAPE_INTERVAL_HOURS:-6}
      # Optioneel: zet een token om handmatig een scrape te starten via POST /api/v1/admin/scrape.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Collect&Go weigert vaak het IP van een server (HTTP 456). Dan helpt een relay op een
      # residentieel IP (zie README, "Geblokkeerd door Collect&Go"). Leeg = rechtstreeks.
      COGO_RELAY_URL: ${COGO_RELAY_URL:-}
      COGO_RELAY_SECRET: ${COGO_RELAY_SECRET:-}
      COGO_RELAY_MODE: ${COGO_RELAY_MODE:-fallback}
      # Of: een gewone HTTP(S)/SOCKS5-proxy voor alle aanvragen.
      COGO_PROXY: ${COGO_PROXY:-}
    volumes:
      - prijsspoor-data:/data

  # De relay naast Prijsspoor, achter een profiel: `COMPOSE_PROFILES=relay` in .env.
  # Enkel zinvol met RELAY_PROXY naar een residentiële proxy, want zonder proxy gebruikt hij
  # hetzelfde (geweigerde) IP als de server. Draait de relay thuis, gebruik dan
  # relay/docker-compose.yml daar en laat deze service uit.
  # Zet dan COGO_RELAY_URL=http://relay:8787.
  relay:
    profiles: ["relay"]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    restart: unless-stopped
    init: true
    ipc: host
    environment:
      PORT: "8787"
      RELAY_SECRET: ${COGO_RELAY_SECRET:-}
      RELAY_PROXY: ${RELAY_PROXY:-}
      NODE_PATH: /opt/relay/node_modules
    volumes:
      - ./relay/server.cjs:/srv/server.cjs:ro
      - relay-modules:/opt/relay
    working_dir: /opt/relay
    entrypoint: ["/bin/sh", "-c"]
    # Chromium met een venster op een virtueel scherm (xvfb-run): headless meldt zich als
    # "HeadlessChrome" en wordt tegengehouden.
    command:
      - |
        test -d node_modules/playwright || npm install --no-save --no-audit --no-fund playwright@1.64.1
        exec xvfb-run -a node /srv/server.cjs
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 6s
      retries: 3
      start_period: 120s

volumes:
  prijsspoor-data:
  relay-modules:
