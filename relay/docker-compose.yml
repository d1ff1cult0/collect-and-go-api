# De relay op een machine met een residentieel IP (thuisserver, Raspberry Pi, NAS, ...).
#
#   cp .env.example .env     # vul RELAY_SECRET in: openssl rand -hex 24
#   docker compose up -d
#
# Zet daarna op de server van Prijsspoor:
#   COGO_RELAY_URL=http://<deze machine>:8787     (bv. het Tailscale-adres)
#   COGO_RELAY_SECRET=<hetzelfde geheim>
#
# Stel de poort niet open op het internet: bind hem aan je Tailscale/WireGuard-IP
# (RELAY_BIND hieronder) of zet hem achter je firewall. Het geheim is een tweede slot,
# geen vervanging daarvoor.
services:
  relay:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    restart: unless-stopped
    init: true
    ipc: host
    env_file: .env
    environment:
      PORT: "8787"
      NODE_PATH: /opt/relay/node_modules
    ports:
      - "${RELAY_BIND:-127.0.0.1}:8787:8787"
    volumes:
      - ./server.cjs:/srv/server.cjs:ro
      - relay-modules:/opt/relay
    working_dir: /opt/relay
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        test -d node_modules/playwright || npm install --no-save --no-audit --no-fund playwright@1.64.1
        exec xvfb-run -a node /srv/server.cjs
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 6s
      retries: 3
      start_period: 120s

volumes:
  relay-modules:
